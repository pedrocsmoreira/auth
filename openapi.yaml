openapi: 3.0.3

info:
  title: Auth API
  description: >
    A JWT-based authentication and user management API.

    ## Authentication flow

    1. All requests must include a valid `x-api-key` header.
    2. Call `POST /login` to receive an **access token** (15 min) and a **refresh token** (7 days).
    3. Pass the access token as `Authorization: Bearer <token>` on all protected endpoints.
    4. When the access token expires, call `POST /login/refresh` with the refresh token to obtain a new one.
    5. Call `POST /login/logout` to revoke the refresh token and end the session.

    ## Roles

    | Role    | Permissions |
    |---------|-------------|
    | `admin` | Full CRUD on users, list all users |
    | `user`  | Read own profile, update own profile, change own password |

  version: 1.0.0
  contact: {}

servers:
  - url: http://localhost:3000
    description: Local development server

# ─── Security schemes ────────────────────────────────────────────────────────

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Required on every request. Use `LOGIN_API_KEY` for authentication
        endpoints and `MASTER_API_KEY` for full admin access.

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained from `POST /login` or `POST /login/refresh`.

  # ─── Reusable schemas ──────────────────────────────────────────────────────

  schemas:

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Response payload (type varies per endpoint).

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Invalid credentials

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: pedro
        roleId:
          type: integer
          nullable: true
          example: 2
        password_change:
          type: boolean
          description: Whether the user has ever changed their password.
          example: false
        force_password_change:
          type: boolean
          description: When true, the user must change their password before any other action.
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT (15 min). Use as `Authorization: Bearer <token>`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Long-lived opaque token (7 days). Store securely.
          example: a3f1c2d4e5b6...

    AccessToken:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Operation completed successfully.

  # ─── Reusable responses ────────────────────────────────────────────────────

  responses:

    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Invalid or expired token

    Forbidden:
      description: Valid token but insufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Forbidden: insufficient permissions

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: User not found

    InvalidApiKey:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              value:
                success: false
                error: API key not provided
            invalid:
              value:
                success: false
                error: Invalid API key

# ─── Global security ─────────────────────────────────────────────────────────

security:
  - ApiKeyAuth: []

# ─── Paths ───────────────────────────────────────────────────────────────────

paths:

  # ── /login ────────────────────────────────────────────────────────────────

  /login:
    post:
      tags: [Authentication]
      summary: Log in
      description: >
        Authenticate with a username and password. Returns a short-lived access
        token and a long-lived refresh token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: pedro
                password:
                  type: string
                  format: password
                  example: s3cr3tP@ssword
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          description: Missing username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Username and password are required
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Invalid credentials
        '403':
          $ref: '#/components/responses/InvalidApiKey'

  /login/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      description: >
        Exchange a valid, non-revoked refresh token for a new access token.
        The refresh token itself is not rotated; revoke it explicitly via
        `POST /login/logout`.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: a3f1c2d4e5b6...
      responses:
        '200':
          description: New access token issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AccessToken'
        '400':
          description: Refresh token not provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token is invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Invalid or expired refresh token
        '403':
          $ref: '#/components/responses/InvalidApiKey'

  /login/logout:
    post:
      tags: [Authentication]
      summary: Log out
      description: >
        Revokes the provided refresh token. The access token will continue to
        work until it expires naturally (max 15 min).
      operationId: logout
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: a3f1c2d4e5b6...
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidApiKey'

  /login/change-password:
    post:
      tags: [Authentication]
      summary: Change password
      description: >
        Change the authenticated user's password. Requires the current password
        for verification. This is also the only endpoint accessible when
        `force_password_change` is true in the JWT payload.
      operationId: changePassword
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                  example: oldP@ssword
                newPassword:
                  type: string
                  format: password
                  example: newP@ssword!
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: Password updated successfully
        '400':
          description: Missing fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid current password or missing token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/InvalidApiKey'

  /login/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password reset token
      description: >
        Generates a time-limited reset token (1 hour) for the given username.
        In production, the token would be delivered via email. In development,
        it is logged to the server console.


        The response is always the same message regardless of whether the
        username exists, to prevent user enumeration.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  example: pedro
      responses:
        '200':
          description: Request received (regardless of whether the username exists).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: If that username exists, a reset token has been issued.
        '403':
          $ref: '#/components/responses/InvalidApiKey'

  /login/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with a reset token
      description: >
        Consumes a reset token (obtained from `POST /login/forgot-password`) to
        set a new password. The token is invalidated after use.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  description: Reset token received via forgot-password.
                  example: 9f86d081884c7d...
                newPassword:
                  type: string
                  format: password
                  example: freshP@ssword!
      responses:
        '200':
          description: Password reset successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: Password has been reset successfully
        '400':
          description: Token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Reset token is invalid or has expired
        '403':
          $ref: '#/components/responses/InvalidApiKey'

  # ── /user ─────────────────────────────────────────────────────────────────

  /user:
    get:
      tags: [Users]
      summary: List all users
      description: Returns all users. **Admin only.**
      operationId: listUsers
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: Array of users (passwords excluded).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Users]
      summary: Create a user
      description: Creates a new user account. **Admin only.**
      operationId: createUser
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: newuser
                password:
                  type: string
                  format: password
                  example: initialP@ss!
                roleId:
                  type: integer
                  nullable: true
                  description: ID of the role to assign. Omit for no role.
                  example: 1
                force_password_change:
                  type: boolean
                  default: false
                  description: When true, the user must change their password on first login.
      responses:
        '201':
          description: User created (password excluded from response).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          description: Missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Username already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Username already exists

  /user/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric user ID.
        schema:
          type: integer
          example: 1

    get:
      tags: [Users]
      summary: Get a user
      description: >
        Returns a single user by ID (password excluded).
        Requires a valid access token; any authenticated user may read any profile.
      operationId: getUser
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      summary: Update a user
      description: >
        Update a user's details. Admins may update any user (including role
        assignment and `force_password_change`). Non-admins may only update
        their own profile and cannot change role-related fields.
      operationId: updateUser
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: updatedname
                password:
                  type: string
                  format: password
                  description: If provided, the value will be hashed before storage.
                  example: newP@ssword!
                roleId:
                  type: integer
                  nullable: true
                  description: Admin only. Assign a different role.
                  example: 2
                force_password_change:
                  type: boolean
                  description: Admin only. Force the user to change their password.
                  example: false
      responses:
        '200':
          description: User updated (password excluded from response).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Username already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Username already exists

    delete:
      tags: [Users]
      summary: Delete a user
      description: Permanently deletes a user and all associated refresh tokens. **Admin only.**
      operationId: deleteUser
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: User deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

tags:
  - name: Authentication
    description: >
      Login, logout, token refresh, and password management.
      Most endpoints require only the API key (no JWT). Endpoints that
      modify account state also require a valid Bearer token.
  - name: Users
    description: >
      User CRUD operations. All endpoints require both a valid API key
      **and** a Bearer token.

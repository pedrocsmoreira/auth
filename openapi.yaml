openapi: 3.0.3

info:
  title: Auth API
  description: >
    A JWT-based authentication and user management API.

    ## Authentication flow

    1. Call `GET /health` to verify the API is up (no key required).
    2. All other requests must include a valid `x-api-key` header.
    3. Call `POST /login` to receive an **access token** (15 min) and a **refresh token** (7 days).
    4. Pass the access token as `Authorization: Bearer <token>` on all protected endpoints.
    5. When the access token expires, call `POST /login/refresh` with the refresh token — a **new refresh token is also returned** (rolling rotation).
    6. Call `POST /login/logout` to revoke the current refresh token, or `POST /login/logout-all` to revoke all sessions at once.

    ## Roles

    | Role    | Permissions |
    |---------|-------------|
    | `admin` | Full CRUD on users, list all users |
    | `user`  | Read own profile, update own profile, change own password |

  version: 1.0.0
  contact: {}

servers:
  - url: http://localhost:3000
    description: Local development server

# ─── Security schemes ────────────────────────────────────────────────────────

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        Required on every request. Use `LOGIN_API_KEY` for authentication
        endpoints and `MASTER_API_KEY` for full admin access.

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token obtained from `POST /login` or `POST /login/refresh`.

  # ─── Reusable schemas ──────────────────────────────────────────────────────

  schemas:

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Response payload (type varies per endpoint).

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Invalid credentials

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: pedro
        roleId:
          type: integer
          nullable: true
          example: 2
        password_change:
          type: boolean
          description: Whether the user has ever changed their password.
          example: false
        force_password_change:
          type: boolean
          description: When true, the user must change their password before any other action.
          example: false
        createdAt:
          type: string
          format: date-time
        deactivated_at:
          type: string
          format: date-time
          nullable: true
          description: Set when an admin deactivates the account. Null means active.
          example: null
        updatedAt:
          type: string
          format: date-time

    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
          description: Short-lived JWT (15 min). Use as `Authorization: Bearer <token>`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Long-lived opaque token (7 days). Store securely.
          example: a3f1c2d4e5b6...

    AccessToken:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Operation completed successfully.

    Role:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: admin
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

  # ─── Reusable responses ────────────────────────────────────────────────────

  responses:

    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Invalid or expired token

    Forbidden:
      description: Valid token but insufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Forbidden: insufficient permissions

    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: User not found

    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Too many requests, please try again later

    InvalidApiKey:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              value:
                success: false
                error: API key not provided
            invalid:
              value:
                success: false
                error: Invalid API key

# ─── Global security ─────────────────────────────────────────────────────────

security:
  - ApiKeyAuth: []

# ─── Paths ───────────────────────────────────────────────────────────────────

paths:

  # ── /health ───────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns the current API status and uptime. No API key or auth token required.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: API is running.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status:
                            type: string
                            example: ok
                          uptime:
                            type: number
                            description: Process uptime in seconds.
                            example: 42.5
                          timestamp:
                            type: string
                            format: date-time

  # ── /login ────────────────────────────────────────────────────────────────

  /login:
    post:
      tags: [Authentication]
      summary: Log in
      description: >
        Authenticate with a username and password. Returns a short-lived access
        token and a long-lived refresh token.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: pedro
                password:
                  type: string
                  format: password
                  example: s3cr3tP@ssword
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          description: Missing username or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Username and password are required
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Invalid credentials
        '403':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /login/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token (with rotation)
      description: >
        Exchange a valid, non-revoked refresh token for a **new access token and
        a new refresh token** (rolling rotation). The old refresh token is
        immediately revoked — store only the new one.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: a3f1c2d4e5b6...
      responses:
        '200':
          description: New token pair issued. The old refresh token is now revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'
        '400':
          description: Refresh token not provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Refresh token is invalid, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Invalid or expired refresh token
        '403':
          $ref: '#/components/responses/InvalidApiKey'

  /login/logout-all:
    post:
      tags: [Authentication]
      summary: Revoke all sessions
      description: >
        Revokes **all** refresh tokens belonging to the authenticated user,
        effectively logging them out from every device/client simultaneously.
        Access tokens already issued will continue to work until they expire (max 15 min).
      operationId: logoutAll
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: All sessions revoked.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: All sessions have been revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidApiKey'

  /login/logout:
    post:
      tags: [Authentication]
      summary: Log out
      description: >
        Revokes the provided refresh token. The access token will continue to
        work until it expires naturally (max 15 min).
      operationId: logout
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: a3f1c2d4e5b6...
      responses:
        '200':
          description: Logged out successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: Logged out successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InvalidApiKey'

  /login/change-password:
    post:
      tags: [Authentication]
      summary: Change password
      description: >
        Change the authenticated user's password. Requires the current password
        for verification. This is also the only endpoint accessible when
        `force_password_change` is true in the JWT payload.
      operationId: changePassword
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                  format: password
                  example: oldP@ssword
                newPassword:
                  type: string
                  format: password
                  example: newP@ssword!
      responses:
        '200':
          description: Password updated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: Password updated successfully
        '400':
          description: Missing fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid current password or missing token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/InvalidApiKey'

  /login/forgot-password:
    post:
      tags: [Authentication]
      summary: Request a password reset token
      description: >
        Generates a time-limited reset token (1 hour) for the given username.
        In production, the token would be delivered via email. In development,
        it is logged to the server console.


        The response is always the same message regardless of whether the
        username exists, to prevent user enumeration.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  example: pedro
      responses:
        '200':
          description: Request received (regardless of whether the username exists).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: If that username exists, a reset token has been issued.
        '403':
          $ref: '#/components/responses/InvalidApiKey'

  /login/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password with a reset token
      description: >
        Consumes a reset token (obtained from `POST /login/forgot-password`) to
        set a new password. The token is invalidated after use.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                  description: Reset token received via forgot-password.
                  example: 9f86d081884c7d...
                newPassword:
                  type: string
                  format: password
                  example: freshP@ssword!
      responses:
        '200':
          description: Password reset successfully.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: Password has been reset successfully
        '400':
          description: Token is missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Reset token is invalid or has expired
        '403':
          $ref: '#/components/responses/InvalidApiKey'

  # ── /user ─────────────────────────────────────────────────────────────────

  /user:
    get:
      tags: [Users]
      summary: List all users
      description: Returns a paginated list of all users. **Admin only.**
      operationId: listUsers
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number (1-based). Defaults to 1.
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of users per page. Defaults to 20, max 100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
      responses:
        '200':
          description: Paginated list of users (passwords excluded).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items:
                              $ref: '#/components/schemas/User'
                          total:
                            type: integer
                            description: Total number of users across all pages.
                            example: 42
                          page:
                            type: integer
                            example: 1
                          limit:
                            type: integer
                            example: 20
                          pages:
                            type: integer
                            description: Total number of pages.
                            example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Users]
      summary: Create a user (invite flow)
      description: >
        Creates a new user account. **Admin role + master API key required.**


        The admin **never sets or sees the user's password**. Instead, the server
        generates an opaque `inviteToken` (valid 48 h) which the admin passes to
        the new user. The new user calls `POST /login/reset-password` with that
        token to choose their own password and activate their account.


        `force_password_change` is always set to `true` on creation.


        This endpoint is intentionally unavailable to applications using the
        `LOGIN_API_KEY` — only the designated user-management application
        (holding the `MASTER_API_KEY`) may provision accounts.
      operationId: createUser
      security:
        - ApiKeyAuth: [MasterKey]
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  example: newuser
                roleId:
                  type: integer
                  nullable: true
                  description: ID of the role to assign. Omit for no role.
                  example: 1
      responses:
        '201':
          description: >
            User created. The `inviteToken` must be passed to the new user so they
            can set their password via `POST /login/reset-password`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/User'
                          - type: object
                            required: [inviteToken]
                            properties:
                              inviteToken:
                                type: string
                                description: One-time token (48 h TTL). Pass to the new user to activate their account.
                                example: 9f86d081884c7d659a2feaa0c55ad015...
        '400':
          description: Missing required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Username already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Username already exists

  /user/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric user ID.
        schema:
          type: integer
          example: 1

    get:
      tags: [Users]
      summary: Get a user
      description: >
        Returns a single user by ID (password excluded).
        Requires a valid access token; any authenticated user may read any profile.
      operationId: getUser
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Users]
      summary: Update a user
      description: >
        Update a user's details. Admins may update any user (including role
        assignment and `force_password_change`). Non-admins may only update
        their own profile and cannot change role-related fields.
      operationId: updateUser
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: updatedname
                password:
                  type: string
                  format: password
                  description: If provided, the value will be hashed before storage.
                  example: newP@ssword!
                roleId:
                  type: integer
                  nullable: true
                  description: Admin only. Assign a different role.
                  example: 2
                force_password_change:
                  type: boolean
                  description: Admin only. Force the user to change their password.
                  example: false
      responses:
        '200':
          description: User updated (password excluded from response).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Username already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Username already exists

    delete:
      tags: [Users]
      summary: Delete a user
      description: >
        Permanently deletes a user and all associated refresh tokens.
        **Admin role + master API key required.**


        Like user creation, this operation is restricted to the application
        holding the `MASTER_API_KEY` and is unavailable to `LOGIN_API_KEY` clients.
      operationId: deleteUser
      security:
        - ApiKeyAuth: [MasterKey]
        - BearerAuth: []
      responses:
        '200':
          description: User deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/{id}/deactivate:
    post:
      tags: [Users]
      summary: Deactivate a user
      description: >
        Sets `deactivated_at` on the user record, preventing them from logging in
        or using any authenticated endpoint. **Admin role + master API key required.**


        The user's existing sessions (refresh tokens) are not automatically
        revoked — their access tokens will stop working at next check.
      operationId: deactivateUser
      security:
        - ApiKeyAuth: [MasterKey]
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric user ID.
          schema:
            type: integer
            example: 2
      responses:
        '200':
          description: User deactivated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: User deactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /user/{id}/reactivate:
    post:
      tags: [Users]
      summary: Reactivate a user
      description: >
        Clears `deactivated_at`, allowing the user to log in and use the API again.
        **Admin role + master API key required.**
      operationId: reactivateUser
      security:
        - ApiKeyAuth: [MasterKey]
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric user ID.
          schema:
            type: integer
            example: 2
      responses:
        '200':
          description: User reactivated.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: User reactivated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── /roles ────────────────────────────────────────────────────────────────

  /roles:
    get:
      tags: [Roles]
      summary: List all roles
      description: >
        Returns all roles. Accessible with either the login API key or the master API key.
      operationId: listRoles
      responses:
        '200':
          description: List of roles.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Role'
        '403':
          $ref: '#/components/responses/InvalidApiKey'

    post:
      tags: [Roles]
      summary: Create a role
      description: >
        Creates a new role. **Master API key required.**
      operationId: createRole
      security:
        - ApiKeyAuth: [MasterKey]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 64
                  example: editor
      responses:
        '201':
          description: Role created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Role'
        '400':
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Role already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Role already exists

  /roles/{id}:
    get:
      tags: [Roles]
      summary: Get a role
      description: >
        Returns a single role by ID. Accessible with either the login API key or the master API key.
      operationId: getRole
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric role ID.
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Role found.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Role'
        '403':
          $ref: '#/components/responses/InvalidApiKey'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Roles]
      summary: Delete a role
      description: >
        Deletes a role by ID. **Master API key required.**
      operationId: deleteRole
      security:
        - ApiKeyAuth: [MasterKey]
      parameters:
        - name: id
          in: path
          required: true
          description: Numeric role ID.
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Role deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageResponse'
              example:
                success: true
                data:
                  message: Role deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

tags:
  - name: Health
    description: Liveness probe — no authentication required.
  - name: Authentication
    description: >
      Login, logout, token refresh, and password management.
      Most endpoints require only the API key (no JWT). Endpoints that
      modify account state also require a valid Bearer token.
  - name: Users
    description: >
      User CRUD operations. All endpoints require both a valid API key
      **and** a Bearer token.
  - name: Roles
    description: >
      Role management. GET endpoints require any valid API key (login or master).
      POST and DELETE require the master API key.
